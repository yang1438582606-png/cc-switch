name: Antigravity Windows Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/antigravity-acp-quota

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 validation and installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pinned Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Antigravity and usage tests
        run: pnpm exec vitest run src/components/antigravity tests/components/UsageDashboard.test.tsx

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-antigravity-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
